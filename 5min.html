<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5 Minutes Meditation</title>
    <link rel="stylesheet" href="5min.css">
</head>
<body>
    <audio id="meditation-audio" loop autoplay>
        <source src="5minute.mp3" type="audio/mpeg">
    </audio>
    <div class="timebox">
        <div class="time"> 
            <h2 id="minutes">05:</h2>
            <p>minutes</p>
        </div>
        <div class="time"> 
            <h2 id="seconds">00</h2>
            <p>seconds</p>
        </div>
    </div>
    <script src="5min.js"></script>
</body>
</html>
